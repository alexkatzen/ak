<script>
(function() {
  var sentences = [
    "Alex creates in Berkeley, Ca.",
    "Alex designs in Berkeley, Ca.",
    "Alex builds in Berkeley, Ca.",
    "Alex is a high-agency human."
  ];
  var PREFIX = "Alex ";
  var el = document.querySelector('.typewriter-text');
  var sentenceIndex = 0;
  var charIndex = 0;
  var isDeleting = false;

  function tick() {
    var current = sentences[sentenceIndex];

    if (!isDeleting) {
      charIndex++;
      el.innerHTML = current.substring(0, charIndex);
      if (charIndex === current.length) {
        isDeleting = true;
        setTimeout(tick, 1800);
        return;
      }
      setTimeout(tick, 80);
    } else {
      charIndex--;
      el.innerHTML = current.substring(0, charIndex);
      if (charIndex === PREFIX.length) {
        isDeleting = false;
        sentenceIndex = (sentenceIndex + 1) % sentences.length;
        setTimeout(tick, 400);
        return;
      }
      setTimeout(tick, 40);
    }
  }

  tick();
})();
</script>
