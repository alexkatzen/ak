<style>
  body {
    margin: 0;
    background-color: #08060f;
    overflow: hidden;
  }

  #sketch canvas {
    display: block;
  }

  /* About overlay */
  #about-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  #about-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-content {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    right: 2rem;
    pointer-events: none;
    /* clicks fall through to overlay for dismissal */
  }

  .overlay-content h1 {
    font-family: "univers-light";
    font-size: clamp(1.5rem, 2.5vw, 1.875rem);
    letter-spacing: -0.02em;
    line-height: 0.85;
    word-spacing: -0.09em;
    margin: 0;
  }

  .overlay-content h1 a {
    color: white;
    text-decoration: none;
    pointer-events: auto;
  }

</style>

<a id="about-btn" class="page-nav-link" href="#">about</a>

<div id="about-overlay">
  <div class="overlay-content">
    <h1><a href="mailto:hello@alexkatzen.com?subject=👋 Hello"><span class="typewriter-text"></span></a></h1>
  </div>
</div>

<div id="sketch"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
  // --- Typewriter ---
  var twTimeout = null;
  var twEl = document.querySelector('.typewriter-text');

  function startTypewriter() {
    var sentences = [
      "Alex is obsessed with golf.",
      "Alex is struggling at golf.",
      "Alex is a high-agency human.",
      "Alex is a CC🪦C alumnus.",
      "Alex is a sleep enthusiast.",
      "Alex is a learner.",
      "Alex is a designer, builder, and maker.",
    ];
    for (var s = sentences.length - 1; s > 0; s--) {
      var r = Math.floor(Math.random() * (s + 1));
      var t = sentences[s]; sentences[s] = sentences[r]; sentences[r] = t;
    }
    var cursor        = '<span class="typewriter-cursor"></span>';
    var mobile        = window.innerWidth < 768;
    var sentenceIndex = 0;
    var charIndex     = 0;
    var isDeleting      = false;
    var isMovingBack    = false;
    var isMovingForward = false;
    var moveTarget      = 0;
    var deleteTarget  = 0;
    var keepSuffix    = '';
    var typeTarget    = sentences[0].length;
    twEl.innerHTML    = '';

    function commonPrefixLen(a, b) {
      var i = 0;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      return i;
    }

    function commonSuffixLen(a, b, pLen) {
      var j = 0;
      while (j < a.length - pLen && j < b.length - pLen &&
             a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
      return j;
    }

    function tick() {
      var current = sentences[sentenceIndex];
      if (isMovingBack || isMovingForward) {
        charIndex += isMovingForward ? 1 : -1;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + current.substring(charIndex);
        if (charIndex === moveTarget) {
          keepSuffix      = current.substring(charIndex);
          isMovingBack    = false;
          isMovingForward = false;
          isDeleting      = true;
          twTimeout       = setTimeout(tick, 80);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 55 : 30);
      } else if (!isDeleting) {
        charIndex++;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + keepSuffix;
        if (charIndex === typeTarget) {
          var next = sentences[(sentenceIndex + 1) % sentences.length];
          var pLen = commonPrefixLen(current, next);
          var sLen = commonSuffixLen(current, next, pLen);
          deleteTarget = pLen;
          moveTarget   = current.length - sLen;
          typeTarget   = next.length - sLen;
          if (charIndex > moveTarget) {
            isMovingBack = true;
          } else if (charIndex < moveTarget) {
            isMovingForward = true;
          } else {
            keepSuffix = current.substring(moveTarget);
            isDeleting = true;
          }
          twTimeout = setTimeout(tick, 2800);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 70 : 38);
      } else {
        charIndex--;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + keepSuffix;
        if (charIndex === deleteTarget) {
          isDeleting    = false;
          sentenceIndex = (sentenceIndex + 1) % sentences.length;
          twTimeout     = setTimeout(tick, 100);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 35 : 19);
      }
    }
    tick();
  }

  function stopTypewriter() {
    clearTimeout(twTimeout);
    twTimeout = null;
    twEl.innerHTML = '';
  }

  // --- Overlay ---
  var overlay = document.getElementById('about-overlay');

  var aboutBtn = document.getElementById('about-btn');

  function openAbout(e) {
    e.preventDefault();
    overlay.classList.add('is-open');
    aboutBtn.classList.add('is-hidden');
    startTypewriter();
  }

  function closeAbout() {
    overlay.classList.remove('is-open');
    aboutBtn.classList.remove('is-hidden');
    stopTypewriter();
  }

  document.getElementById('about-btn').addEventListener('click', function (e) {
    overlay.classList.contains('is-open') ? closeAbout() : openAbout(e);
  });

  overlay.addEventListener('click', closeAbout);

  // --- p5 sketch: starfield ---
  new p5(function (p) {
    var stars = [];
    var cores = navigator.hardwareConcurrency || 2;
    var isMobile = window.innerWidth < 768;
    var NUM_STARS = isMobile
      ? (cores >= 6 ? 2500 : 1500)
      : (cores >= 8 ? 8000 : cores >= 4 ? 5000 : 3000);
    var MAX_Z = 2000;
    var SPEED = 0.6;
    var cx, cy;

    p.setup = function () {
      var c = p.createCanvas(p.windowWidth, p.windowHeight);
      c.parent('sketch');
      cx = p.width / 2;
      cy = p.height / 2;
      spawnStars(true);
    };

    function makeStar(initial) {
      var z = initial ? p.random(1, MAX_Z) : MAX_Z;
      var half = Math.max(p.width, p.height) / 2;
      return {
        x: p.random(-half, half),
        y: p.random(-half, half),
        z: z,
        pz: z,
        twinkle: p.random(0.0008, 0.0025),
        phase: p.random(p.TWO_PI),
        bright: p.random(1) > 0.5,
        large: p.random(1) > 0.99,
      };
    }

    function spawnStars(initial) {
      stars = [];
      for (var i = 0; i < NUM_STARS; i++) {
        stars.push(makeStar(initial));
      }
    }

    p.draw = function () {
      p.background(8, 6, 15);
      p.translate(cx, cy);
      var ms = p.millis();

      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        s.pz = s.z;
        s.z -= SPEED;

        if (s.z <= 1) { stars[i] = makeStar(false); continue; }

        var sx = (s.x / s.z) * cx * 2;
        var sy = (s.y / s.z) * cy * 2;
        var px = (s.x / s.pz) * cx * 2;
        var py = (s.y / s.pz) * cy * 2;

        if (sx < -cx - 2 || sx > cx + 2 || sy < -cy - 2 || sy > cy + 2) {
          stars[i] = makeStar(false); continue;
        }

        var progress = 1 - s.z / MAX_Z;
        var starSize = p.map(progress, 0, 1, 0.05, 1.4) * (s.large ? 1.5 : 1.0);
        var flicker = p.sin(ms * s.twinkle + s.phase);
        var baseAlpha = p.map(progress, 0, 1, 15, s.bright ? 255 : 160);
        var alpha = p.map(flicker, -1, 1, baseAlpha * 0.75, baseAlpha);

        p.stroke(220, 225, 255, alpha * 0.2);
        p.strokeWeight(starSize * 0.4);
        p.line(px, py, sx, sy);

        p.noStroke();
        p.fill(235, 238, 255, alpha);
        p.ellipse(sx, sy, starSize * 2, starSize * 2);
      }
    };

    p.windowResized = function () {
      p.resizeCanvas(p.windowWidth, p.windowHeight);
      cx = p.width / 2;
      cy = p.height / 2;
    };
  }, 'sketch');
</script>
