<style>
  body {
    margin: 0;
    background-color: #030302;
    overflow: hidden;
  }

  #sketch canvas {
    display: block;
  }

  /* About overlay */
  #about-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  #about-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-content {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    right: 2rem;
    pointer-events: none;
    /* clicks fall through to overlay for dismissal */
  }

  .overlay-content h1 {
    font-family: "univers-light";

    letter-spacing: -0.02em;

  }

  .overlay-content h1 a {
    color: white;
    text-decoration: none;
    pointer-events: auto;
  }

</style>

<div id="about-overlay">

<div id="sketch"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
  // --- Typewriter ---
  var twTimeout = null;
  var twEl = document.querySelector('.typewriter-text');

  function startTypewriter() {
    var pairs = [
      ["Alex is obsessed with golf.", "Alex is struggling at golf."],
      ["Alex is a graphic designer.", "Alex is a product designer.", "Alex is a communications designer."],
    ];
    var singles = [
      "Alex is a high-agency human.",
      "Alex is a CCAC alumnus.",
      "Alex is a Bay Area native.",
      "Alex is powered by black coffee.",
      "Alex is aggressively mediocre at chess."
    ];

    function buildCycle(avoid) {
      var pool = singles.slice();
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      for (var p = 0; p < pairs.length; p++) {
        var group = pairs[p].slice();
        for (var g = group.length - 1; g > 0; g--) {
          var h = Math.floor(Math.random() * (g + 1));
          var tg = group[g]; group[g] = group[h]; group[h] = tg;
        }
        var pos = Math.floor(Math.random() * (pool.length + 1));
        pool = pool.slice(0, pos).concat(group).concat(pool.slice(pos));
      }
      if (avoid) {
        for (var k = 1; k < pool.length; k++) {
          if (pool[k] !== avoid) {
            var tmp2 = pool[0]; pool[0] = pool[k]; pool[k] = tmp2;
            break;
          }
        }
      }
      return pool;
    }

    var sentences = buildCycle(null);
    var cursor        = '<span class="typewriter-cursor"></span>';
    var mobile        = window.innerWidth < 768;
    var sentenceIndex = 0;
    var charIndex     = 0;
    var isDeleting      = false;
    var isMovingBack    = false;
    var isMovingForward = false;
    var moveTarget      = 0;
    var deleteTarget  = 0;
    var keepSuffix    = '';
    var typeTarget    = sentences[0].length;
    var currentSentence = sentences[0];
    twEl.innerHTML    = '';

    function commonPrefixLen(a, b) {
      var i = 0;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      return i;
    }

    function commonWordSuffixLen(a, b) {
      var wa = a.split(' '), wb = b.split(' '), n = 0;
      while (n < wa.length && n < wb.length && wa[wa.length - 1 - n] === wb[wb.length - 1 - n]) n++;
      return n === 0 ? 0 : wa.slice(wa.length - n).join(' ').length;
    }

    function tick() {
      var current = currentSentence;
      if (isMovingBack || isMovingForward) {
        charIndex += isMovingForward ? 1 : -1;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + current.substring(charIndex);
        if (charIndex === moveTarget) {
          keepSuffix      = current.substring(charIndex);
          isMovingBack    = false;
          isMovingForward = false;
          isDeleting      = true;
          twTimeout       = setTimeout(tick, 80);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 55 : 30);
      } else if (!isDeleting) {
        charIndex++;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + keepSuffix;
        if (charIndex === typeTarget) {
          if ((sentenceIndex + 1) % sentences.length === 0) {
            sentences = buildCycle(current);
          }
          var next = sentences[(sentenceIndex + 1) % sentences.length];
          var pLen = commonPrefixLen(current, next);
          var sLen = commonWordSuffixLen(current, next);
          deleteTarget = pLen;
          moveTarget   = current.length - sLen;
          typeTarget   = next.length - sLen;
          if (charIndex > moveTarget) {
            isMovingBack = true;
          } else if (charIndex < moveTarget) {
            isMovingForward = true;
          } else {
            keepSuffix = current.substring(moveTarget);
            isDeleting = true;
          }
          twTimeout = setTimeout(tick, 2800);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 70 : 38);
      } else {
        if (charIndex === deleteTarget) {
          isDeleting      = false;
          sentenceIndex   = (sentenceIndex + 1) % sentences.length;
          currentSentence = sentences[sentenceIndex];
          twTimeout       = setTimeout(tick, 100);
          return;
        }
        charIndex--;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + keepSuffix;
        twTimeout = setTimeout(tick, mobile ? 35 : 19);
      }
    }
    tick();
  }

  function stopTypewriter() {
    clearTimeout(twTimeout);
    twTimeout = null;
    twEl.innerHTML = '';
  }

  // --- Overlay ---
  var overlay = document.getElementById('about-overlay');

  var aboutBtn = document.getElementById('about-btn');

  function openAbout(e) {
    e.preventDefault();
    overlay.classList.add('is-open');
    aboutBtn.classList.add('is-hidden');
    startTypewriter();
  }

  function closeAbout() {
    overlay.classList.remove('is-open');
    aboutBtn.classList.remove('is-hidden');
    stopTypewriter();
  }

  document.getElementById('about-btn').addEventListener('click', function (e) {
    overlay.classList.contains('is-open') ? closeAbout() : openAbout(e);
  });

  overlay.addEventListener('click', closeAbout);

  // --- p5 sketch: ASCII fireworks ---
  // Ambient show only, ported from a standalone p5 sketch that also had HUD
  // controls (play/pause, manual launch, shape-test buttons) and click-to-launch â
  // none of that made the cut here, just the fireworks themselves.
  new p5(function (p) {
    var CHARSET = " .:-=+*#%@";
    var FONT_SIZE = 14;
    var CELL_W = FONT_SIZE * 0.6;
    var CELL_H = FONT_SIZE * 1.15;

    var COLS = 0, ROWS = 0;
    var scale = 1; // size scale factor vs a ~900px reference
    var gridB, gridH, gridS, gridL; // per-cell brightness/hue/sat/light buffers
    var touchedFlag, touched = [];  // dirty-cell bookkeeping (see paintCell/draw)
    var stars = [];

    var particles = [];
    var rockets = [];
    var pendingBursts = [];

    var GRAVITY = 240;
    var ROCKET_GRAVITY = 460;

    var autoSpawn = true;
    var spawnTimer = 0.6;
    var maxParticles = 1800;

    // Curated hue pool for "mono"/"rainbow" shells, and pre-picked pairs for "bicolor"
    // shells (see colorMode in explode()) â avoids the muddy yellow-green band of a
    // fully random hue.
    var HUES = [0, 18, 32, 45, 330, 300, 275, 210, 190, 150, 170];
    var PAIR_HUES = [[0, 45], [210, 45], [330, 190], [275, 45], [150, 330], [190, 0]];
    function pickHue() { return HUES[(Math.random() * HUES.length) | 0]; }

    // Burst shapes with equal odds of being picked; smiley-face is rolled separately
    // and much more rarely (see explode()).
    var REGULAR_STYLES = ["peony", "willow", "crackle", "crossette", "strobe", "palm", "encore"];

    function computeGrid() {
      COLS = Math.max(1, Math.floor(p.width / CELL_W));
      ROWS = Math.max(1, Math.floor(p.height / CELL_H));
      gridB = new Float32Array(COLS * ROWS);
      gridH = new Float32Array(COLS * ROWS);
      gridS = new Float32Array(COLS * ROWS);
      gridL = new Float32Array(COLS * ROWS);
      touchedFlag = new Uint8Array(COLS * ROWS);
      touched = [];

      scale = Math.min(2, Math.max(0.55, Math.min(p.width, p.height) / 900));
      maxParticles = Math.max(260, Math.min(3200, Math.round(COLS * ROWS * 0.16)));

      var starCount = Math.max(20, Math.round((p.width * p.height * 0.75) / 13000));
      stars = [];
      for (var i = 0; i < starCount; i++) {
        stars.push({
          x: (Math.random() * p.width) | 0,
          y: (Math.random() * p.height * 0.75) | 0,
          base: 0.25 + Math.random() * 0.45,
          phase: Math.random() * Math.PI * 2,
          speed: 0.6 + Math.random() * 1.2,
        });
      }
    }

    function paintCell(col, row, brightness, h, s, l) {
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return;
      var idx = row * COLS + col;
      if (brightness > gridB[idx]) {
        gridB[idx] = brightness; gridH[idx] = h; gridS[idx] = s; gridL[idx] = l;
        if (!touchedFlag[idx]) { touchedFlag[idx] = 1; touched.push(idx); }
      }
    }

    function splat(x, y, brightness, h, s, l, glow) {
      var col = Math.floor(x / CELL_W);
      var row = Math.floor(y / CELL_H);
      paintCell(col, row, brightness, h, s, l);
      if (glow && brightness > 0.5) {
        var g = brightness * 0.4;
        paintCell(col + 1, row, g, h, s, l);
        paintCell(col - 1, row, g, h, s, l);
        paintCell(col, row + 1, g, h, s, l);
        paintCell(col, row - 1, g, h, s, l);
      }
    }

    function spawnTrail(x, y, hue) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 12,
        vy: Math.random() * 20,
        life: 0.3 + Math.random() * 0.25,
        maxLife: 0.45,
        hue: hue, sat: 50, gravityScale: 0.4, dragK: 0.02,
        mode: "trail",
      });
    }

    // BURST SHAPE TYPES ("style"): each branch below is where a shape's physics
    // (gravity, drag, lifespan) is defined. "peony" is the default/fallthrough case.
    function makeStar(x, y, angle, speed, hue, colorMode, style, sizeFactor) {
      var sat = 85 + Math.random() * 15;
      var gravityScale = 1;
      var dragK = 0.012; // quadratic drag coeff: fast bleed-off at high speed, long trailing hang at low speed
      var maxLife = 1.8 + Math.random() * 1.0;
      var crossette = false, crossetteAt = 0;
      var glitter = false;

      if (style === "willow") {
        // WILLOW: heavy, slow-falling particles that keep emitting trail sparks (see p.willow below).
        gravityScale = 1.5; dragK = 0.008;
        maxLife = 2.8 + Math.random() * 1.4;
        sat = 55 + Math.random() * 20;
      } else if (style === "smiley-face") {
        // SMILEY-FACE: angle/speed are constrained in explode() so particles stay on a circle; physics here is mild.
        gravityScale = 0.75; dragK = 0.015;
        maxLife = 1.6 + Math.random() * 0.8;
      } else if (style === "crackle") {
        // CRACKLE: real pyrotechnic "gold lace" effect â always gold (forced below,
        // overriding whatever color mode the shell rolled), and instead of fading smoothly
        // it flickers with rapid, sharp glitter flashes for its whole burn.
        maxLife = 1.5 + Math.random() * 0.9;
        dragK = 0.013;
        gravityScale = 0.9;
        glitter = true;
      } else if (style === "crossette") {
        // CROSSETTE: each star flies out plain, then near the end of its arc snaps into
        // a small 4-point "+" of secondary sparks.
        maxLife = 1.4 + Math.random() * 0.7;
        dragK = 0.015;
        crossette = true;
        crossetteAt = maxLife * (0.55 + Math.random() * 0.2);
      } else if (style === "palm") {
        // PALM: fewer, thick drooping fronds (see explode()'s arm-cluster spawn) that
        // each flare into a brilliant "foot" near the end of their arc â real palm shells
        // do this with a slower-burning composition at the star's core.
        gravityScale = 1.3; dragK = 0.009;
        maxLife = 2.2 + Math.random() * 1.0;
        sat = 70 + Math.random() * 20;
      }
      // PEONY: no branch above matches, so it just keeps the defaults set at the top
      // of this function â a plain round burst with no extra physics or effects.

      // COLOR MODE TYPES: whiteflash/rainbow tweak the star here; mono/bicolor are resolved
      // up in explode() (hueA/hueB) before makeStar() is ever called.
      if (colorMode === "rainbow") hue = pickHue();
      if (colorMode === "whiteflash") sat = 30 + Math.random() * 40;
      if (glitter) { hue = 46; sat = 85 + Math.random() * 15; } // crackle is always gold

      // Quadratic drag makes travel distance scale with ln(speed), not speed directly,
      // so a naive speed bump barely changes burst radius. Dividing drag by sizeFactor
      // cancels that log compression and restores a burst radius that scales with sizeFactor
      // the way it did before (see explode(), where speed is already multiplied by sizeFactor).
      dragK /= sizeFactor;

      var palm = style === "palm";
      var footAt = palm ? maxLife * (0.22 + Math.random() * 0.1) : 0;

      // ENCORE: every star of this style burns out completely, goes dark for a beat
      // (darkGapDuration, see the inDarkGap handling in updateSim), then relights and
      // burns a second, much shorter life while blinking rapidly (encoreActive,
      // rendered in drawSim) instead of just fading out once.
      var encoreEligible = style === "encore";
      var darkGapDuration = encoreEligible ? 0.15 + Math.random() * 0.25 : 0;
      var encoreMaxLife = encoreEligible ? 0.4 + Math.random() * 0.4 : 0;
      var encoreRate = encoreEligible ? 10 + Math.random() * 6 : 0; // blinks per second
      var encorePhase = Math.random();

      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: maxLife, maxLife: maxLife,
        hue: hue, sat: sat, gravityScale: gravityScale, dragK: dragK,
        glitter: glitter,
        crossette: crossette, crossetteAt: crossetteAt, crossetted: false,
        whiteflash: colorMode === "whiteflash",
        willow: style === "willow",
        palm: palm, footAt: footAt,
        encoreEligible: encoreEligible, reignited: false,
        inDarkGap: false, darkGapRemaining: 0, darkGapDuration: darkGapDuration,
        encoreMaxLife: encoreMaxLife, encoreActive: false, encoreRate: encoreRate, encorePhase: encorePhase,
        trailTimer: 0,
        mode: "star",
      });
    }

    // SMILEY-FACE: the small yellow face riding inside the ring, built from the same
    // "smiley-face" star physics so it expands and fades in lockstep with the ring itself.
    function spawnSmiley(x, y, baseSpeed, sizeFactor) {
      var faceSpeed = baseSpeed * 0.5;
      var rot = Math.random() * Math.PI * 2; // random orientation each time
      var cosR = Math.cos(rot), sinR = Math.sin(rot);
      var spawnFeature = function (dx, dy) {
        var rdx = dx * cosR - dy * sinR;
        var rdy = dx * sinR + dy * cosR;
        var angle = Math.atan2(rdy, rdx);
        var speed = faceSpeed * Math.hypot(rdx, rdy);
        makeStar(x, y, angle, speed, 50, "mono", "smiley-face", sizeFactor);
      };

      spawnFeature(-0.28, -0.15);
      spawnFeature(0.28, -0.15);

      var mouthPoints = 9;
      for (var i = 0; i < mouthPoints; i++) {
        var dx = -0.45 + (i / (mouthPoints - 1)) * 0.9;
        var dy = 0.15 + 0.35 * (1 - (dx / 0.45) ** 2);
        spawnFeature(dx, dy);
      }
    }

    // PALM: a handful of thick, evenly-spaced fronds, each a tight cluster of stars
    // travelling together so it reads as a solid arm instead of a spray of points.
    function spawnPalm(x, y, baseSpeed, colorMode, hueA, hueB, sizeFactor) {
      var armCount = Math.round((7 + Math.random() * 4) * 1.33 * Math.max(1, Math.sqrt(sizeFactor)));
      var starsPerArm = 5 + Math.round(Math.random() * 2);
      for (var a = 0; a < armCount; a++) {
        var armAngle = (a / armCount) * Math.PI * 2 + (Math.random() - 0.5) * 0.25;
        var hue = colorMode === "bicolor" ? (Math.random() < 0.5 ? hueA : hueB) : hueA;
        for (var j = 0; j < starsPerArm; j++) {
          var angle = armAngle + (Math.random() - 0.5) * 0.05;
          var speed = baseSpeed * (0.75 + Math.random() * 0.3) * (0.92 + j * 0.03);
          makeStar(x, y, angle, speed, hue, colorMode, "palm", sizeFactor);
        }
      }
    }

    // STROBE: a short-lived flash particle that stays invisible and motionless until
    // its ignitionDelay elapses, then pops to near-white brightness and cuts off fast
    // (see the "flash" branch of drawSim) instead of fading smoothly like a normal star.
    function makeFlashStar(x, y, angle, speed, hue, ignitionDelay, intensity) {
      var life = (0.16 + Math.random() * 0.14) * intensity;
      particles.push({
        x: x, y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: life, maxLife: life,
        hue: hue, sat: 65 + Math.random() * 35,
        gravityScale: 0.3, dragK: 0.03,
        ignitionDelay: ignitionDelay,
        flash: true,
        crossGlow: Math.random() < 0.3, // only some flashes get the cardinal-neighbor "+" glow
        mode: "star",
      });
    }

    // STROBE: instead of one smooth burst, the shell is built from tight clusters
    // scattered irregularly around the burst (random angle + radius, not an even
    // sphere). Clusters are grouped into waves â every cluster in a wave shares
    // (almost) the same ignitionDelay so several pop together at once â and the
    // waves themselves are staggered across the shell's life so groups of flashes
    // cascade in like separate volleys instead of one uniform twinkle.
    function spawnStrobeClusters(x, y, baseSpeed, colorMode, hueA, hueB, sizeFactor) {
      var waveCount = Math.round((5 + Math.random() * 3) * Math.max(1, Math.sqrt(sizeFactor)));
      var clustersPerWave = 4 + Math.round(Math.random() * 3);
      var cascadeWindow = 0.45 + Math.random() * 0.3; // total time the waves cascade over
      var maxRadius = baseSpeed * (0.184 + Math.random() * 0.092); // keeps clusters clumped, not scattered across the sky

      for (var w = 0; w < waveCount; w++) {
        // Stratified so the waves spread evenly across the cascade instead of clumping
        // together by chance, while still landing at an organically jittered moment.
        var waveDelay = ((w + Math.random()) / waveCount) * cascadeWindow;

        for (var wc = 0; wc < clustersPerWave; wc++) {
          var angle = Math.random() * Math.PI * 2;
          var radius = maxRadius * (0.2 + Math.random() * 0.8);
          var cx = x + Math.cos(angle) * radius;
          var cy = y + Math.sin(angle) * radius;
          var ignitionDelay = waveDelay + Math.random() * 0.04; // tiny jitter, still reads as "at once"

          // Per-cluster hue: bicolor/rainbow alternate or scatter across the palette as
          // before, but even mono/whiteflash shells get a small random hue drift per
          // cluster so consecutive pops aren't perfect color copies of each other.
          var baseHue = colorMode === "bicolor" ? (Math.random() < 0.5 ? hueA : hueB)
            : colorMode === "rainbow" ? pickHue()
            : hueA;
          var hue = (baseHue + (Math.random() - 0.5) * 26 + 360) % 360;

          // Per-cluster intensity: some pops are small quick blips, others bigger,
          // brighter, and slightly longer â so the cascade doesn't read as one flash
          // copy-pasted over and over.
          var intensity = 0.65 + Math.random() * 0.9;

          var starsInCluster = Math.max(2, Math.round((3 + Math.random() * 3) * intensity));
          for (var j = 0; j < starsInCluster; j++) {
            var jitterAngle = Math.random() * Math.PI * 2;
            var jitterSpeed = scale * (6 + Math.random() * 8) * intensity; // tight â reads as one flash point, not a spray
            makeFlashStar(cx, cy, jitterAngle, jitterSpeed, hue, ignitionDelay, intensity);
          }
        }
      }
    }

    function explode(x, y) {
      // --- BURST SHAPE picked here (equal odds among the regulars; smiley-face is a rare extra) ---
      // peony = round burst in all directions Â· willow = drooping, trailing sparks
      // crackle = gold glitter "lace" that flickers instead of fading smoothly
      // crossette = each star later snaps into a small 4-point "+" Â· palm = a handful of
      // thick fronds that each flare into a bright "foot" near the end (see spawnPalm())
      // strobe = a cascade of tight clusters scattered irregularly around the burst, each
      // dormant until its own delay elapses then popping into a bright flash (see
      // spawnStrobeClusters()) Â· encore = explodes and decays normally, then every star
      // goes completely dark for a beat and relights, blinking rapidly and trailing
      // sparks as it burns down a second, shorter life Â· smiley-face = particles on a
      // circle, with a small face riding inside (see spawnSmiley()) â only a 1% chance
      // per shell, so it reads as a special surprise, not a regular shape
      var style = Math.random() < 0.01 ? "smiley-face" : REGULAR_STYLES[(Math.random() * REGULAR_STYLES.length) | 0];

      // --- COLOR MODE picked here (weighted 40/25/20/15) ---
      // mono = one hue Â· bicolor = two hues from PAIR_HUES Â· whiteflash = white-hot core
      // cooling to a hue Â· rainbow = every particle its own random hue
      var roll = Math.random();
      var colorMode = roll < 0.4 ? "mono" : roll < 0.65 ? "bicolor" : roll < 0.85 ? "whiteflash" : "rainbow";

      var hueA = pickHue(), hueB = hueA;
      if (colorMode === "bicolor") {
        var pair = PAIR_HUES[(Math.random() * PAIR_HUES.length) | 0];
        hueA = pair[0]; hueB = pair[1];
      }

      var sizeFactor = 0.65 + Math.random() * 1.85; // most shells modest, occasional ones up to 2.5x
      var count = Math.round((style === "willow" ? 46 : style === "smiley-face" ? 56 : style === "crackle" ? 130 : 78) * scale * Math.sqrt(sizeFactor));
      var baseSpeed = (style === "willow" ? 225 : style === "smiley-face" ? 550 : style === "palm" ? 480 : 610) * scale * sizeFactor;
      var smileyAngleJitter = style === "smiley-face" ? 0.06 : 1.0;

      if (style === "palm") {
        spawnPalm(x, y, baseSpeed, colorMode, hueA, hueB, sizeFactor);
      } else if (style === "strobe") {
        spawnStrobeClusters(x, y, baseSpeed, colorMode, hueA, hueB, sizeFactor);
      } else {
        for (var i = 0; i < count; i++) {
          var angle = style === "smiley-face"
            ? (i / count) * Math.PI * 2 + (Math.random() - 0.5) * smileyAngleJitter
            : Math.random() * Math.PI * 2;
          var speed = style === "smiley-face"
            ? baseSpeed * (0.92 + Math.random() * 0.16)
            : baseSpeed * (0.35 + Math.random() * 0.85);
          var hue = colorMode === "bicolor" ? (Math.random() < 0.5 ? hueA : hueB) : hueA;
          makeStar(x, y, angle, speed, hue, colorMode, style, sizeFactor);
        }
      }

      if (style === "smiley-face") spawnSmiley(x, y, baseSpeed, sizeFactor);

      // DOUBLE BURST: ~16% chance this shell schedules a second, independently
      // randomized explode() at the same spot a beat later.
      if (Math.random() < 0.16) {
        pendingBursts.push({ x: x, y: y - 4, delay: 0.35 + Math.random() * 0.25 });
      }
    }

    function spawnShell(px) {
      var x = px != null ? px : p.width * (0.15 + Math.random() * 0.7);
      var riseFrac = 0.35 + Math.random() * 0.42;
      var vy0 = -Math.sqrt(2 * ROCKET_GRAVITY * p.height * riseFrac);
      rockets.push({
        x: x, y: p.height + 6,
        vx: (Math.random() - 0.5) * 26,
        vy: vy0,
        age: 0,
        trailAcc: 0,
        hue: 42,
      });
    }

    function updateSim(dt) {
      // rockets
      for (var i = rockets.length - 1; i >= 0; i--) {
        var r = rockets[i];
        r.vy += ROCKET_GRAVITY * dt;
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        r.age += dt;
        r.trailAcc += dt;
        if (r.trailAcc > 0.02) {
          r.trailAcc = 0;
          spawnTrail(r.x, r.y, r.hue);
        }
        if (r.vy >= -18 || r.age > 2.6) {
          explode(r.x, r.y);
          rockets.splice(i, 1);
        }
      }

      // pending secondary bursts
      for (var i2 = pendingBursts.length - 1; i2 >= 0; i2--) {
        var pb = pendingBursts[i2];
        pb.delay -= dt;
        if (pb.delay <= 0) { explode(pb.x, pb.y); pendingBursts.splice(i2, 1); }
      }

      // particles
      for (var i3 = particles.length - 1; i3 >= 0; i3--) {
        var pt = particles[i3];

        // STROBE: a flash particle stays dormant â invisible, no physics, life frozen â
        // until its cluster's ignitionDelay elapses, which is what produces the staggered
        // cascade of pops instead of everything igniting at once.
        if (pt.ignitionDelay > 0) {
          pt.ignitionDelay -= dt;
          continue;
        }

        // ENCORE: once act one has fully burned out, the star goes completely dark and
        // motionless for a short beat before relighting â see the life<=0 handling
        // below for where inDarkGap gets set, and drawSim for how it stays invisible.
        if (pt.inDarkGap) {
          pt.darkGapRemaining -= dt;
          if (pt.darkGapRemaining <= 0) {
            pt.inDarkGap = false;
            pt.reignited = true;
            pt.life = pt.encoreMaxLife;
            pt.maxLife = pt.encoreMaxLife;
            pt.whiteflash = true;
            pt.encoreActive = true;
          }
          continue;
        }

        pt.vy += GRAVITY * pt.gravityScale * dt;
        // Quadratic (velocity-squared) drag: bleeds off speed fast while the star is
        // still moving fast, then tails off slowly once it's down to a gentle drift â
        // this is what gives the "shoots out fast, hangs and fades slowly" look.
        var speed = Math.hypot(pt.vx, pt.vy);
        if (speed > 0.01) {
          var newSpeed = speed / (1 + pt.dragK * speed * dt);
          var dragRatio = newSpeed / speed;
          pt.vx *= dragRatio; pt.vy *= dragRatio;
        }
        pt.x += pt.vx * dt; pt.y += pt.vy * dt;
        pt.life -= dt;

        // WILLOW / PALM / ENCORE (blink phase): all three keep emitting trail sparks
        // as they fall, which is what gives them their drooping, streak-like arms
        // instead of a clean burst outline.
        if (pt.willow || pt.palm || pt.encoreActive) {
          pt.trailTimer = (pt.trailTimer || 0) + dt;
          if (pt.trailTimer > 0.045 && pt.life > 0.2) {
            pt.trailTimer = 0;
            spawnTrail(pt.x, pt.y, pt.hue);
          }
        }

        // CROSSETTE: at the crossetteAt threshold, the plain star is retired in favor
        // of 4 small secondary sparks snapping out at right angles to its flight path.
        if (pt.crossette && !pt.crossetted && pt.life <= pt.crossetteAt) {
          pt.crossetted = true;
          var velAngle = Math.atan2(pt.vy, pt.vx) || Math.random() * Math.PI * 2;
          for (var k = 0; k < 4; k++) {
            var a = velAngle + k * (Math.PI / 2);
            var s = (55 + Math.random() * 35) * scale;
            particles.push({
              x: pt.x, y: pt.y,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s,
              life: 0.5 + Math.random() * 0.3, maxLife: 0.8,
              hue: pt.hue, sat: Math.min(100, pt.sat + 10), gravityScale: 0.6, dragK: 0.02,
              whiteflash: false, mode: "star",
            });
          }
        }

        // ENCORE: act one has fully burned out â instead of removing the star, send it
        // dark for a beat (handled at the top of this loop next frame) before it
        // relights for act two.
        if (pt.encoreEligible && !pt.reignited && pt.life <= 0) {
          pt.inDarkGap = true;
          pt.darkGapRemaining = pt.darkGapDuration;
          continue;
        }

        if (pt.life <= 0 || pt.y > p.height + 30 || pt.x < -30 || pt.x > p.width + 30) {
          particles.splice(i3, 1);
        }
      }

      if (autoSpawn && particles.length < maxParticles) {
        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnShell();
          spawnTimer = 0.55 + Math.random() * 1.2;
        }
      }
    }

    function drawSim(time) {
      // Only clear the cells that actually got painted last frame, instead of the
      // whole grid â most of the sky is empty at any given moment, so this (and the
      // matching draw loop below) skips scanning the tens of thousands of dark cells.
      for (var i = 0; i < touched.length; i++) {
        var idx = touched[i];
        gridB[idx] = 0;
        touchedFlag[idx] = 0;
      }
      touched.length = 0;

      for (var ri = 0; ri < rockets.length; ri++) {
        splat(rockets[ri].x, rockets[ri].y, 1, 45, 70, 82, false);
      }

      for (var pi = 0; pi < particles.length; pi++) {
        var pt = particles[pi];
        if (pt.ignitionDelay > 0) continue; // still dormant, hasn't popped yet
        if (pt.inDarkGap) continue; // ENCORE: completely dark during the beat before act two

        var b, l, s;
        if (pt.flash) {
          // STROBE: a punchy flash curve instead of a smooth fade â holds near-peak
          // brightness through most of its short life, runs white-hot for the first
          // instant, then cuts off fast at the very end. Reads as a camera-flash pop
          // rather than a star gradually dimming.
          var bf = Math.max(0, pt.life / pt.maxLife);
          b = bf > 0.35 ? 1 : bf / 0.35;
          if (b <= 0.02) continue;
          l = 55 + b * 40;
          s = pt.sat;
          if (bf > 0.6) {
            var fwf = (bf - 0.6) / 0.4;
            l = l + fwf * (96 - l);
            s = s * (1 - fwf * 0.85);
          }
        } else {
          b = Math.max(0, pt.life / pt.maxLife);
          b = Math.pow(b, 0.45); // stays visibly bright through most of its life, then dims out at the very end
          if (b <= 0.02) continue;
          l = 28 + b * 60;
          s = pt.sat;
          if (pt.whiteflash && b > 0.6) {
            var w = (b - 0.6) / 0.4;
            l = l + w * (94 - l);
            s = s * (1 - w * 0.8);
          }
          if (pt.encoreActive) {
            // ENCORE: a rapid on/off blink layered on top of the fresh decay envelope
            // â a square wave, not a smooth flicker, for that "blinking as it burns
            // down a second time" read.
            var cycle = (time * 0.001 * pt.encoreRate + pt.encorePhase) % 1;
            b *= cycle < 0.5 ? 1 : 0.12;
            if (b <= 0.02) continue;
          }
          if (pt.palm && pt.life <= pt.footAt) {
            // PALM FOOT: brightens toward a hot glowing tip as the frond nears the end
            // of its arc, instead of just fading out like a plain star.
            var fw = 1 - pt.life / pt.footAt;
            l = l + fw * (92 - l);
            s = s * (1 - fw * 0.6);
          }
          if (pt.glitter) {
            // CRACKLE: rapid, sharp on/off sparkle layered on top of the overall fade
            // envelope â most frames a glitter star sits nearly dark, occasionally
            // flashing bright gold.
            var spark = Math.random() < 0.3 ? 0.9 + Math.random() * 0.1 : 0.08 + Math.random() * 0.14;
            b *= spark;
            if (b <= 0.02) continue;
            l = 22 + b * 70;
          }
        }
        // Only some flash particles get the cardinal-neighbor "+" glow (crossGlow,
        // rolled once at spawn) â at flash brightness and cluster tightness, giving
        // every single one that symmetric glow makes the whole cascade read as
        // identical crosses instead of a mix of point-like and cross-like pops.
        splat(pt.x, pt.y, b, pt.hue, s, l, pt.mode === "star" && (!pt.flash || pt.crossGlow));
      }

      p.colorMode(p.RGB, 255, 255, 255, 1);
      p.noStroke();
      p.background(3, 3, 2);

      for (var si = 0; si < stars.length; si++) {
        var st = stars[si];
        var flicker = 0.7 + 0.3 * Math.sin(time * 0.001 * st.speed + st.phase);
        p.fill(210, 222, 255, Math.min(1, st.base * flicker));
        p.rect(st.x, st.y, 1, 1);
      }

      p.colorMode(p.HSL, 360, 100, 100, 1);
      for (var ti = 0; ti < touched.length; ti++) {
        var cellIdx = touched[ti];
        var bb = gridB[cellIdx];
        if (bb <= 0.03) continue;
        var charIdx = Math.min(CHARSET.length - 1, Math.round(bb * (CHARSET.length - 1)));
        if (charIdx === 0) continue;
        var row = (cellIdx / COLS) | 0;
        var col = cellIdx - row * COLS;
        p.fill(gridH[cellIdx], gridS[cellIdx], gridL[cellIdx]);
        p.text(CHARSET[charIdx], col * CELL_W, row * CELL_H);
      }
    }

    p.setup = function () {
      var c = p.createCanvas(p.windowWidth, p.windowHeight);
      c.parent('sketch');
      p.pixelDensity(p.displayDensity());
      p.noStroke();
      p.textFont('"Menlo", "DejaVu Sans Mono", "SFMono-Regular", Consolas, monospace');
      p.textSize(FONT_SIZE);
      p.textAlign(p.LEFT, p.TOP);
      computeGrid();
    };

    var resizePending = false;
    p.windowResized = function () {
      if (resizePending) return;
      resizePending = true;
      requestAnimationFrame(function () {
        resizePending = false;
        p.resizeCanvas(p.windowWidth, p.windowHeight);
        computeGrid();
      });
    };

    p.draw = function () {
      var dt = Math.min(0.05, (p.deltaTime || 16) / 1000);
      updateSim(dt);
      drawSim(p.millis());
    };
  }, 'sketch');
</script>
