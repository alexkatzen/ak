<style>
  body {
    margin: 0;
    background-color: #0a0f1e;
    overflow: hidden;
  }

  #sketch canvas {
    display: block;
  }

  #about-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  #about-overlay.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-content {
    position: absolute;
    bottom: 2rem;
    left: 2rem;
    right: 2rem;
    pointer-events: none;
  }

  .overlay-content h1 {
    font-family: "univers-light";
    font-size: clamp(3rem, 10vw, 7.5rem);
    letter-spacing: -0.02em;
    line-height: 0.85;
    word-spacing: -0.09em;
    margin: 0;
  }

  .overlay-content h1 a {
    color: ivory;
    text-decoration: none;
    pointer-events: auto;
  }
</style>

<a id="about-btn" class="page-nav-link" href="#">about</a>

<div id="about-overlay">
  <div class="overlay-content">
    <h1><a href="mailto:hello@alexkatzen.com?subject=Hello"><span class="typewriter-text"></span></a></h1>
  </div>
</div>

<div id="sketch"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
  // --- Typewriter ---
  var twTimeout = null;
  var twEl = document.querySelector('.typewriter-text');

  function startTypewriter() {
    var sentences = [
      "Alex is obsessed with golf.",
      "Alex is struggling at golf.",
      "Alex is a high-agency human.",
      "Alex is a sleep enthusiast.",
      "Alex is a learner.",
      "Alex is a designer, builder, and maker.",
    ];
    for (var s = sentences.length - 1; s > 0; s--) {
      var r = Math.floor(Math.random() * (s + 1));
      var t = sentences[s]; sentences[s] = sentences[r]; sentences[r] = t;
    }
    var cursor        = '<span class="typewriter-cursor"></span>';
    var mobile        = window.innerWidth < 768;
    var sentenceIndex = 0;
    var charIndex     = 0;
    var isDeleting      = false;
    var isMovingBack    = false;
    var isMovingForward = false;
    var moveTarget      = 0;
    var deleteTarget  = 0;
    var keepSuffix    = '';
    var typeTarget    = sentences[0].length;
    twEl.innerHTML    = '';

    function commonPrefixLen(a, b) {
      var i = 0;
      while (i < a.length && i < b.length && a[i] === b[i]) i++;
      return i;
    }

    function commonSuffixLen(a, b, pLen) {
      var j = 0;
      while (j < a.length - pLen && j < b.length - pLen &&
             a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
      return j;
    }

    function tick() {
      var current = sentences[sentenceIndex];
      if (isMovingBack || isMovingForward) {
        charIndex += isMovingForward ? 1 : -1;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + current.substring(charIndex);
        if (charIndex === moveTarget) {
          keepSuffix      = current.substring(charIndex);
          isMovingBack    = false;
          isMovingForward = false;
          isDeleting      = true;
          twTimeout       = setTimeout(tick, 80);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 55 : 30);
      } else if (!isDeleting) {
        charIndex++;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + keepSuffix;
        if (charIndex === typeTarget) {
          var next = sentences[(sentenceIndex + 1) % sentences.length];
          var pLen = commonPrefixLen(current, next);
          var sLen = commonSuffixLen(current, next, pLen);
          deleteTarget = pLen;
          moveTarget   = current.length - sLen;
          typeTarget   = next.length - sLen;
          if (charIndex > moveTarget) {
            isMovingBack = true;
          } else if (charIndex < moveTarget) {
            isMovingForward = true;
          } else {
            keepSuffix = current.substring(moveTarget);
            isDeleting = true;
          }
          twTimeout = setTimeout(tick, 2800);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 70 : 38);
      } else {
        charIndex--;
        twEl.innerHTML = current.substring(0, charIndex) + cursor + keepSuffix;
        if (charIndex === deleteTarget) {
          isDeleting    = false;
          sentenceIndex = (sentenceIndex + 1) % sentences.length;
          twTimeout     = setTimeout(tick, 100);
          return;
        }
        twTimeout = setTimeout(tick, mobile ? 35 : 19);
      }
    }
    tick();
  }

  function stopTypewriter() {
    clearTimeout(twTimeout);
    twTimeout = null;
    twEl.innerHTML = '';
  }

  // --- Overlay ---
  var overlay = document.getElementById('about-overlay');

  function openAbout(e) {
    e.preventDefault();
    overlay.classList.add('is-open');
    startTypewriter();
  }

  function closeAbout() {
    overlay.classList.remove('is-open');
    stopTypewriter();
  }

  document.getElementById('about-btn').addEventListener('click', function (e) {
    overlay.classList.contains('is-open') ? closeAbout() : openAbout(e);
  });

  overlay.addEventListener('click', closeAbout);

  // --- p5 sketch: nebula ---
  new p5(function (p) {
    var pg;
    var stars = [];
    var SCALE = 5;
    var NUM_STARS = 120;
    var dx, dy;

    p.setup = function () {
      var c = p.createCanvas(p.windowWidth, p.windowHeight);
      c.parent('sketch');
      var angle = (p.random(1) > 0.5 ? 0 : p.PI) + p.random(-10, 10) * (p.PI / 180);
      dx = p.cos(angle);
      dy = p.sin(angle);
      buildBuffer();
      spawnStars();
    };

    function buildBuffer() {
      pg = p.createGraphics(Math.ceil(p.width / SCALE), Math.ceil(p.height / SCALE));
      pg.pixelDensity(1);
    }

    function spawnStars() {
      stars = [];
      for (var i = 0; i < NUM_STARS; i++) {
        stars.push({
          nx: p.random(1),
          ny: p.random(1),
          r: p.random(0.5, 2.0),
          baseAlpha: p.random(160, 230),
          twinkle: p.random(0.0005, 0.0016),
          phase: p.random(p.TWO_PI),
          depth: p.random(0.5, 1.0),
        });
      }
    }

    function hsbToRgb(h, s, b) {
      var i = Math.floor(h * 6);
      var f = h * 6 - i;
      var p0 = b * (1 - s);
      var q = b * (1 - f * s);
      var tv = b * (1 - (1 - f) * s);
      var r, g, bl;
      switch (i % 6) {
        case 0: r = b; g = tv; bl = p0; break;
        case 1: r = q; g = b; bl = p0; break;
        case 2: r = p0; g = b; bl = tv; break;
        case 3: r = p0; g = q; bl = b; break;
        case 4: r = tv; g = p0; bl = b; break;
        case 5: r = b; g = p0; bl = q; break;
      }
      return [(r * 255) | 0, (g * 255) | 0, (bl * 255) | 0];
    }

    p.draw = function () {
      var ms = p.millis();
      var t = ms * 0.000020625;

      p.background(6, 5, 12);

      p.noStroke();
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var flicker = p.sin(ms * s.twinkle + s.phase);
        var alpha = p.map(flicker, -1, 1, s.baseAlpha * 0.5, s.baseAlpha) * s.depth;
        p.fill(235, 235, 255, alpha);
        p.ellipse(s.nx * p.width, s.ny * p.height, s.r * 2, s.r * 2);
      }

      var yFreq = Math.max(1.0, pg.height / pg.width);

      pg.loadPixels();
      for (var y = 0; y < pg.height; y++) {
        for (var x = 0; x < pg.width; x++) {
          var nx = x / pg.width;
          var ny = y / pg.height;

          var swell = p.noise(nx * 2.0 + t * 0.65 * dx, ny * 2.0 * yFreq + t * 0.65 * dy);
          var chop = p.noise(nx * 4.5 + 50 + t * 0.5 * dx, ny * 4.5 * yFreq + 50 + t * 0.5 * dy);
          var shimmer = p.noise(nx * 10 + 100 + t * 2.2 * dx, ny * 10 * yFreq + 100 + t * 2.2 * dy);

          var hue = p.map(swell, 0, 1, 0.58, 0.80);
          var sat = p.map(chop, 0, 1, 0.35, 0.72);
          var bri = p.map(swell * 0.55 + chop * 0.3 + shimmer * 0.15, 0, 1, 0.08, 0.60);

          if (shimmer > 0.76) {
            var gv = p.map(shimmer, 0.76, 1, 0, 1);
            bri = p.lerp(bri, 0.96, gv * gv);
            sat = p.lerp(sat, 0.15, gv * gv);
          }

          var alpha = (p.map(bri, 0.12, 0.80, 136, 198)) | 0;

          var rgb = hsbToRgb(hue, sat, bri);
          var idx = 4 * (y * pg.width + x);
          pg.pixels[idx] = rgb[0];
          pg.pixels[idx + 1] = rgb[1];
          pg.pixels[idx + 2] = rgb[2];
          pg.pixels[idx + 3] = alpha;
        }
      }
      pg.updatePixels();
      p.image(pg, 0, 0, p.width, p.height);
    };

    p.windowResized = function () {
      p.resizeCanvas(p.windowWidth, p.windowHeight);
      buildBuffer();
    };
  }, 'sketch');
</script>
